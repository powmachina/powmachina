[package]
name = "powmachina-wallet-gui"
version = "0.1.0"
edition = "2021"
description = "PowMachina Wallet"
authors = ["xbinor"]
license = "BSD-3-Clause"

# Library (the logic) and binary (the entry point) kept apart — Tauri does it this way so
# the same logic can also be used by a mobile build.
[lib]
name = "powmachina_wallet_gui"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "powmachina-wallet-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[profile.release]
# A wallet is not shipped with megabytes of waste.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
