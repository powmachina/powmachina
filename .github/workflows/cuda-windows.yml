# The miner's GPU plugin for Windows (powm-cuda.dll).
#
# Why a hosted runner: on Windows `nvcc` drives MSVC — the DLL
# cannot be cross-built. The Linux plugin is built in release.yml instead.
#
# This job **compiles only**. A GitHub runner has no card, so the test vectors cannot run here; the
# kernel is verified on real hardware before a
# release takes the DLL. What this job does prove is that the plugin still builds under MSVC and
# still exports all ten symbols — the two things that break silently.
name: cuda-windows

on:
  push:
    branches: [testnet]
    paths:
      - "machinahash-cuda/**"
      - ".github/workflows/cuda-windows.yml"
  workflow_dispatch:
  # release.yml calls this instead of copying the steps: the -gencode list has to stay identical
  # between a plain build and a release, and two copies of it would drift. The inputs let the same
  # steps build a second plugin for an older toolkit (Pascal, sm_61, which CUDA 13 dropped) without a
  # copy of the job; they default to the main CUDA 13 / sm_75..120 build, so push and the plain call
  # are unchanged.
  workflow_call:
    inputs:
      cuda_version:
        type: string
        default: "13.4.3"
      cuda_sha256:
        type: string
        default: "35296d52a972c931a70cf8084120e3a0f0479de13f12527fcebfe8fbcaf5399c"
      installer_url:
        type: string
        default: "https://developer.download.nvidia.com/compute/cuda/13.4.3/local_installers/cuda_13.4.3_windows_x86_64.exe"
      gencode:
        type: string
        default: "-gencode arch=compute_75,code=sm_75 -gencode arch=compute_80,code=sm_80 -gencode arch=compute_86,code=sm_86 -gencode arch=compute_89,code=sm_89 -gencode arch=compute_90,code=sm_90 -gencode arch=compute_120,code=sm_120 -gencode arch=compute_120,code=compute_120"
      output:
        type: string
        default: "powm-cuda.dll"
      artifact:
        type: string
        default: "powm-cuda-windows-x64"

permissions:
  contents: read

env:
  # The same toolkit the DLL was verified with on a card. Changing it changes what comes out. The
  # `||` defaults make push and workflow_dispatch (no inputs) build exactly the main CUDA 13 plugin.
  CUDA_VERSION: ${{ inputs.cuda_version || '13.4.3' }}
  CUDA_SHA256: ${{ inputs.cuda_sha256 || '35296d52a972c931a70cf8084120e3a0f0479de13f12527fcebfe8fbcaf5399c' }}
  CUDA_URL: ${{ inputs.installer_url || 'https://developer.download.nvidia.com/compute/cuda/13.4.3/local_installers/cuda_13.4.3_windows_x86_64.exe' }}
  GENCODE: ${{ inputs.gencode || '-gencode arch=compute_75,code=sm_75 -gencode arch=compute_80,code=sm_80 -gencode arch=compute_86,code=sm_86 -gencode arch=compute_89,code=sm_89 -gencode arch=compute_90,code=sm_90 -gencode arch=compute_120,code=sm_120 -gencode arch=compute_120,code=compute_120' }}
  OUT_DLL: ${{ inputs.output || 'powm-cuda.dll' }}
  ART_NAME: ${{ inputs.artifact || 'powm-cuda-windows-x64' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The whole toolkit, silently. Compiling needs no card.
      - name: CUDA toolkit
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\cuda.exe"
          curl.exe -fsSL --retry 3 -o $exe $env:CUDA_URL
          $got = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:CUDA_SHA256) { throw "the CUDA installer has hash $got, expected $env:CUDA_SHA256" }
          $p = Start-Process $exe -ArgumentList '-s' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the CUDA installer exited with $($p.ExitCode)" }
          $bin = Get-ChildItem "$env:ProgramFiles\NVIDIA GPU Computing Toolkit\CUDA\v*\bin" | Select-Object -First 1
          "$($bin.FullName)" >> $env:GITHUB_PATH

      # The default architecture list is the one the .so is built with and it has to stay the same:
      # a release has to run on the same range of cards on both systems. The Pascal build overrides
      # it (sm_61, which CUDA 13 dropped).
      - name: Build %OUT_DLL%
        shell: cmd
        working-directory: machinahash-cuda
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          if not exist bin mkdir bin
          nvcc --version || exit /b 1
          nvcc -O3 -std=c++17 %GENCODE% ^
            -shared -cudart static -o bin\%OUT_DLL% plugin\powm_cuda.cu || exit /b 1
          dumpbin /nologo /exports bin\%OUT_DLL% > bin\exports.txt || exit /b 1
          dumpbin /nologo /dependents bin\%OUT_DLL%

      # Without the export macro the DLL builds, loads, and then every GetProcAddress returns null.
      - name: All ten symbols are exported
        shell: bash
        working-directory: machinahash-cuda
        run: |
          for s in pmc_abi pmc_device_count pmc_device_info pmc_create pmc_destroy \
                   pmc_set_epoch pmc_set_job pmc_search pmc_hash pmc_config; do
            grep -qw "$s" bin/exports.txt || { echo "$s is not exported"; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ART_NAME }}
          path: machinahash-cuda/bin/${{ env.OUT_DLL }}
          if-no-files-found: error
          retention-days: 30
